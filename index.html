<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>প্রযুক্তির দর্পণ | বাংলায় প্রযুক্তির ভবিষ্যৎ</title>
<meta name="description" content="কৃত্রিম বুদ্ধিমত্তা, গ্যাজেট, প্রোগ্রামিং ও সাইবার নিরাপত্তা নিয়ে বাংলা ভাষায় গভীর বিশ্লেষণ।"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════
   RESET & ROOT
   ══════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a0f1d;--abyss:#050810;--cyan:#00f3ff;--violet:#7b2cbf;
  --magenta:#ff4d9d;--mint:#14f195;
  --glass-bg:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  --glass-border:rgba(255,255,255,.1);
  --glass-shadow:0 8px 32px rgba(2,6,20,.55),inset 0 1px 0 rgba(255,255,255,.08);
  --glow-cyan:0 0 40px -8px rgba(0,243,255,.45);
  --font-bn:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,243,255,.35) transparent}
body{font-family:var(--font-bn);background:var(--navy);color:rgba(233,241,255,.92);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.7}
::selection{background:rgba(0,243,255,.28);color:#fff}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{border:none;cursor:pointer;font-family:inherit;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--violet));border-radius:99px}

/* ══════════════════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════════════════ */
.glass{background:var(--glass-bg);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}
.glass-strong{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 48px rgba(2,6,20,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.text-gradient{background:linear-gradient(105deg,#00f3ff 0%,#8be9ff 35%,#b478ff 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.neon-glow{text-shadow:0 0 14px rgba(0,243,255,.55),0 0 36px rgba(123,44,191,.45)}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ══════════════════════════════════════════════════
   ANIMATIONS
   ══════════════════════════════════════════════════ */
@keyframes blobA{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(9vw,6vh,0) scale(1.18)}66%{transform:translate3d(-7vw,10vh,0) scale(.9)}}
@keyframes blobB{0%,100%{transform:translate3d(0,0,0) scale(1.05)}40%{transform:translate3d(-11vw,-8vh,0) scale(.85)}70%{transform:translate3d(6vw,9vh,0) scale(1.2)}}
@keyframes blobC{0%,100%{transform:translate3d(0,0,0) scale(.95)}50%{transform:translate3d(8vw,-12vh,0) scale(1.25)}}
@keyframes shimmer{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(220%) skewX(-18deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pageIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.anim-blob-a{animation:blobA 22s ease-in-out infinite}
.anim-blob-b{animation:blobB 27s ease-in-out infinite}
.anim-blob-c{animation:blobC 19s ease-in-out infinite}
.anim-marquee{animation:marquee 35s linear infinite}
.anim-spin-slow{animation:spinSlow 16s linear infinite}
.anim-float{animation:float 7s ease-in-out infinite}
.anim-page-in{animation:pageIn .5s ease-out both}
.shimmer-wrap{position:relative;overflow:hidden}
.shimmer-wrap::after{content:'';position:absolute;inset:-8px -33% -8px -33%;width:33%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-120%) skewX(-18deg);transition:none;pointer-events:none;opacity:0}
.shimmer-wrap:hover::after{animation:shimmer 1s ease forwards;opacity:1}

/* ══════════════════════════════════════════════════
   BACKGROUND
   ══════════════════════════════════════════════════ */
#liquid-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--navy)}
#liquid-bg .deep{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,#132043 0%,#0a0f1d 45%,#05080f 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(100px)}
.blob-1{width:38rem;height:38rem;top:-10rem;left:-8rem;background:radial-gradient(circle at 30% 30%,rgba(0,243,255,.42),transparent 65%)}
.blob-2{width:42rem;height:42rem;top:28%;right:-10rem;background:radial-gradient(circle at 60% 40%,rgba(123,44,191,.5),transparent 65%)}
.blob-3{width:34rem;height:34rem;bottom:-18rem;left:22%;background:radial-gradient(circle at 50% 50%,rgba(255,77,157,.28),transparent 65%)}
.blob-4{width:22rem;height:22rem;top:55%;left:8%;background:radial-gradient(circle at 50% 50%,rgba(20,241,149,.18),transparent 65%)}
#liquid-bg .grid-mesh{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at center,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 10%,transparent 75%)}
#liquid-bg .vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 35%,rgba(5,8,15,.75) 100%)}

/* ══════════════════════════════════════════════════
   HEADER
   ══════════════════════════════════════════════════ */
#header{position:fixed;inset:0 0 auto 0;z-index:100;padding:12px 12px 0;display:flex;justify-content:center}
.navbar{display:flex;align-items:center;gap:12px;width:100%;max-width:1200px;padding:12px 20px;border-radius:18px;transition:box-shadow .5s}
.navbar.scrolled{box-shadow:0 8px 40px rgba(0,243,255,.12),var(--glass-shadow)}
.logo-link{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.logo-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,243,255,.2),rgba(123,44,191,.3));border:1px solid rgba(255,255,255,.15)}
.logo-icon svg{width:18px;height:18px;color:var(--cyan);transition:transform .5s}
.logo-link:hover .logo-icon svg{transform:rotate(45deg)}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-bn{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
.logo-en{font-size:9px;text-transform:uppercase;letter-spacing:.22em;color:rgba(255,255,255,.4);display:none}
@media(min-width:640px){.logo-en{display:block}}
.nav-links{display:none;align-items:center;gap:4px;margin-left:16px}
@media(min-width:1024px){.nav-links{display:flex}}
.nav-links a{padding:8px 16px;border-radius:9999px;font-size:.875rem;font-weight:500;color:rgba(255,255,255,.6);transition:all .3s;cursor:pointer}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.1);color:#fff}
.search-box{display:none;align-items:center;gap:8px;border-radius:9999px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);padding:6px 14px;margin-left:auto;transition:all .4s;width:200px}
.search-box:focus-within{width:280px;border-color:rgba(0,243,255,.45);box-shadow:0 0 0 3px rgba(0,243,255,.12)}
@media(min-width:768px){.search-box{display:flex}}
.search-box svg{width:16px;height:16px;flex-shrink:0;color:rgba(0,243,255,.7)}
.search-box input{background:transparent;border:none;outline:none;width:100%;font-size:.875rem;color:#fff}
.search-box input::placeholder{color:rgba(255,255,255,.35)}
.mobile-toggle{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;margin-left:auto;transition:background .3s}
.mobile-toggle:hover{background:rgba(255,255,255,.1)}
@media(min-width:1024px){.mobile-toggle{display:none}}
.mobile-toggle svg{width:20px;height:20px}
#mobile-menu{display:none;position:absolute;left:12px;right:12px;top:72px;border-radius:18px;padding:16px;z-index:90}
#mobile-menu.open{display:block}
#mobile-menu .m-search{display:flex;align-items:center;gap:8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);padding:10px 14px;margin-bottom:12px}
#mobile-menu .m-search input{background:transparent;border:none;outline:none;width:100%;font-size:.875rem;color:#fff}
#mobile-menu .m-search input::placeholder{color:rgba(255,255,255,.35)}
#mobile-menu .m-search svg{width:16px;height:16px;flex-shrink:0;color:rgba(0,243,255,.7)}
#mobile-menu nav{display:flex;flex-direction:column;gap:2px}
#mobile-menu nav a{display:block;padding:10px 16px;border-radius:12px;font-size:.875rem;color:rgba(255,255,255,.75);transition:all .3s;cursor:pointer}
#mobile-menu nav a:hover{background:rgba(255,255,255,.1);color:var(--cyan)}

/* ══════════════════════════════════════════════════
   PAGE CONTAINER
   ══════════════════════════════════════════════════ */
#app{min-height:100vh}

/* ══════════════════════════════════════════════════
   HERO (home)
   ══════════════════════════════════════════════════ */
.hero{position:relative;overflow:hidden;padding:160px 16px 60px;display:flex;align-items:center;justify-content:center;min-height:90vh}
@media(min-width:640px){.hero{padding-top:180px}}
.hero-inner{max-width:1200px;width:100%;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;padding:6px 18px;font-size:.8rem;font-weight:500;color:var(--cyan);border:1px solid rgba(0,243,255,.3);background:rgba(0,243,255,.1)}
.hero-badge .dot{position:relative;width:8px;height:8px}
.hero-badge .dot span{position:absolute;inset:0;border-radius:50%;background:var(--cyan)}
.hero-badge .dot span:first-child{animation:pulseGlow 2s ease-in-out infinite;opacity:.7}
.hero h1{margin-top:24px;font-size:2.5rem;font-weight:800;line-height:1.12;letter-spacing:-.02em}
@media(min-width:640px){.hero h1{font-size:3.5rem}}
@media(min-width:768px){.hero h1{font-size:4.2rem}}
.hero p.sub{margin-top:20px;max-width:640px;margin-inline:auto;font-size:1rem;color:rgba(255,255,255,.6);line-height:1.8}
@media(min-width:640px){.hero p.sub{font-size:1.1rem}}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:32px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9999px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:var(--navy);font-weight:700;font-size:.9rem;box-shadow:0 0 30px rgba(0,243,255,.35);transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden;cursor:pointer}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(0,243,255,.5)}
.btn-primary svg{width:16px;height:16px;transition:transform .3s}
.btn-primary:hover svg.arrow{transform:translateX(3px)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:9999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);font-weight:600;font-size:.9rem;color:rgba(255,255,255,.85);backdrop-filter:blur(12px);transition:all .3s;cursor:pointer}
.btn-secondary:hover{background:rgba(255,255,255,.12);color:#fff}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:460px;margin:48px auto 0}
.stat-card{text-align:center;border-radius:18px;padding:14px 10px}
.stat-card dt{font-size:.65rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em}
.stat-card dd{font-size:1.4rem;font-weight:700;margin-top:4px}

/* featured card */
.featured-wrap{margin-top:56px;position:relative}
.featured-glow{position:absolute;inset:-24px;border-radius:3rem;z-index:-1;background:conic-gradient(from 180deg,rgba(0,243,255,.18),rgba(123,44,191,.25),rgba(255,77,157,.16),rgba(0,243,255,.18));filter:blur(40px)}
.featured-card{display:flex;flex-direction:column;border-radius:2rem;overflow:hidden;text-align:left;transition:transform .5s,box-shadow .5s;cursor:pointer}
.featured-card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(0,243,255,.15)}
@media(min-width:640px){.featured-card{flex-direction:row}}
.featured-img{position:relative;height:240px;overflow:hidden}
@media(min-width:640px){.featured-img{width:42%;height:auto;min-height:280px}}
.featured-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.featured-card:hover .featured-img img{transform:scale(1.08)}
.featured-img .overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,15,29,.7),transparent)}
@media(min-width:640px){.featured-img .overlay{background:linear-gradient(to right,rgba(10,15,29,.7),transparent)}}
.featured-img .badge{position:absolute;left:14px;top:14px;border-radius:9999px;padding:5px 14px;font-size:.72rem;font-weight:700;color:var(--navy);background:var(--cyan)}
.featured-body{flex:1;padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center}
@media(min-width:640px){.featured-body{padding:32px}}
.featured-body .cat{display:inline-block;width:fit-content;padding:4px 14px;border-radius:9999px;font-size:.72rem;font-weight:600;color:rgba(180,160,255,.9);border:1px solid rgba(123,44,191,.3);background:rgba(123,44,191,.12)}
.featured-body h2{font-size:1.35rem;font-weight:700;line-height:1.35;color:#fff}
@media(min-width:640px){.featured-body h2{font-size:1.6rem}}
.featured-body .desc{font-size:.88rem;color:rgba(255,255,255,.55)}
.meta-row{display:flex;flex-wrap:wrap;gap:16px;font-size:.75rem;color:rgba(255,255,255,.45);align-items:center}
.meta-row span{display:flex;align-items:center;gap:4px}
.meta-row svg{width:14px;height:14px}

/* trending bar */
.trending-bar{margin-top:40px;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:16px;overflow:hidden}
.trending-badge{flex-shrink:0;display:flex;align-items:center;gap:6px;border-radius:9999px;padding:5px 14px;font-size:.72rem;font-weight:700;color:var(--magenta);background:rgba(255,77,157,.15);border:1px solid rgba(255,77,157,.3)}
.trending-badge svg{width:14px;height:14px}
.marquee-wrap{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marquee-track{display:flex;gap:32px;width:max-content}
.marquee-track:hover{animation-play-state:paused}
.marquee-track a{white-space:nowrap;font-size:.88rem;color:rgba(255,255,255,.6);transition:color .3s;cursor:pointer}
.marquee-track a:hover{color:var(--cyan)}

/* ══════════════════════════════════════════════════
   CONTENT GRID (feed + sidebar)
   ══════════════════════════════════════════════════ */
.content-grid{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr;gap:40px}
@media(min-width:1024px){.content-grid{grid-template-columns:1fr 340px}}

/* Sort & Filter */
.feed-header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
.feed-title-wrap{display:flex;align-items:center;gap:12px}
.feed-title-wrap .icon-wrap{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,243,255,.25),rgba(123,44,191,.35));border:1px solid rgba(255,255,255,.15)}
.feed-title-wrap .icon-wrap svg{width:20px;height:20px;color:var(--cyan)}
.feed-title-wrap h2{font-size:1.5rem;font-weight:700;color:#fff}
.sort-pills{display:flex;border-radius:9999px;padding:4px;gap:4px}
.sort-pill{padding:7px 16px;border-radius:9999px;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.6);transition:all .3s;cursor:pointer}
.sort-pill:hover{color:#fff}
.sort-pill.active{color:var(--navy);background:linear-gradient(135deg,var(--cyan),var(--violet))}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip{padding:8px 18px;border-radius:9999px;font-size:.78rem;font-weight:500;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);transition:all .3s;cursor:pointer}
.chip:hover{border-color:rgba(255,255,255,.25);color:#fff}
.chip.active{border-color:transparent;color:#fff;background:linear-gradient(120deg,var(--cyan),var(--violet));box-shadow:var(--glow-cyan)}

/* Post Grid */
.post-grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:640px){.post-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.post-grid{grid-template-columns:repeat(3,1fr)}}

/* Post Card */
.post-card{border-radius:1.5rem;overflow:hidden;display:flex;flex-direction:column;transition:transform .5s,box-shadow .5s;cursor:pointer}
.post-card:hover{transform:translateY(-6px);box-shadow:0 20px 60px rgba(0,243,255,.15)}
.card-img{position:relative;height:200px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s}
.post-card:hover .card-img img{transform:scale(1.1)}
.card-img .img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,15,29,.85),rgba(10,15,29,.1),transparent)}
.card-img .cat-badge{position:absolute;left:12px;top:12px;padding:4px 12px;border-radius:9999px;font-size:.68rem;font-weight:600;color:var(--cyan);border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(12px);cursor:pointer}
.card-img .cat-badge:hover{color:#fff;background:rgba(0,243,255,.25)}
.card-img .trending-tag{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:.68rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#f97316,#ec4899)}
.card-img .trending-tag svg{width:12px;height:12px}
.card-body{flex:1;display:flex;flex-direction:column;gap:10px;padding:20px}
.card-body h3{font-size:1.08rem;font-weight:700;line-height:1.4;color:#fff;transition:color .3s}
.post-card:hover .card-body h3{color:var(--cyan)}
.card-body .excerpt{font-size:.84rem;color:rgba(255,255,255,.5);flex:1}
.card-tags{display:flex;flex-wrap:wrap;gap:6px}
.card-tags span{font-size:.68rem;padding:3px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);cursor:pointer;transition:all .3s}
.card-tags span:hover{border-color:rgba(0,243,255,.4);color:var(--cyan)}
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;font-size:.75rem;color:rgba(255,255,255,.45)}
.card-footer .left{display:flex;align-items:center;gap:8px}
.card-footer .avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,243,255,.35),rgba(123,44,191,.45));font-size:.7rem;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.2)}
.card-footer .right{display:flex;align-items:center;gap:12px}
.card-footer svg{width:14px;height:14px}
.read-more{display:flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.45);margin-top:6px;transition:color .3s}
.post-card:hover .read-more{color:var(--cyan)}
.read-more svg{width:14px;height:14px;transition:transform .3s;opacity:0}
.post-card:hover .read-more svg{opacity:1;transform:translateX(3px)}

/* Load more */
.load-more-wrap{text-align:center;margin-top:36px}

/* ══════════════ HELPERS ══════════════ */
const BD="০১২৩৪৫৬৭৮৯".split("");
const bn=v=>String(v).replace(/\d/g,d=>BD[+d]);
const fv=n=>n>=1000?bn((n/1000).toFixed(n%1000===0?0:1))+" হাজার":bn(n);
const BM=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];

  {id:13,slug:"robotics-manufacturing-bd",title:"কারখানায় রোবট: উৎপাদন খাতে অটোমেশন",excerpt:"কোবট এখন আর বিলাসিতা নয়।",content:"পোশাক ও ইলেকট্রনিক্সে অটোমেশন বাস্তব হচ্ছে।\n\n## কোথায় কার্যকর\n\n- প্যাকেজিং\n- গুণগত পরিদর্শন\n- ভারী উপকরণ স্থানান্তর",img:IM("8386487"),cat:"startup",author:"ইমরান কবির",mins:6,views:4380,trend:false,feat:false,tags:["রোবটিক্স","অটোমেশন"],days:18},
  {id:14,slug:"smart-home-privacy",title:"স্মার্ট হোম: সুবিধার বিনিময়ে কতটা গোপনীয়তা?",excerpt:"প্রতিটি ডিভাইসই ডেটা সংগ্রহ করে।",content:"প্রতিটি IoT যন্ত্র সম্ভাব্য প্রবেশপথ।\n\n## সুরক্ষা\n\n- আলাদা নেটওয়ার্কে IoT রাখুন\n- ডিফল্ট পাসওয়ার্ড বদলান\n- লোকাল স্টোরেজ বেছে নিন",img:IM("8294792"),cat:"gadgets",author:"অর্পিতা সেন",mins:5,views:5290,trend:false,feat:false,tags:["স্মার্ট হোম","IoT"],days:21},
  {id:15,slug:"rust-vs-go-2026",title:"Rust বনাম Go ২০২৬: ব্যাকএন্ডে কোনটা বেছে নেবেন?",excerpt:"পারফরম্যান্স চাইলে Rust, প্রোডাক্টিভিটি চাইলে Go — কিন্তু ২০২৬ সালে সমীকরণটা কি বদলে গেছে?",content:"ব্যাকএন্ড ডেভেলপমেন্টে Rust আর Go দুটোই জনপ্রিয়তার শীর্ষে।\n\n## Rust-এর শক্তি\n\n- জিরো-কস্ট অ্যাবস্ট্রাকশন\n- মেমোরি সেফটি কম্পাইল টাইমেই নিশ্চিত\n- WebAssembly সাপোর্ট অসাধারণ\n\n## Go-এর সুবিধা\n\n- শেখা সহজ, কোড পড়া সহজ\n- বিল্ট-ইন কনকারেন্সি (goroutine)\n- দ্রুত কম্পাইলেশন\n\n> ভাষা নির্বাচন প্রজেক্টের ধরন বোঝে, ব্যক্তিগত পছন্দ নয়।\n\n## কখন কোনটা\n\n- সিস্টেম প্রোগ্রামিং, এমবেডেড → Rust\n- মাইক্রোসার্ভিস, CLI টুল → Go\n- দুটোই চমৎকার, দলের দক্ষতাই মূল বিবেচ্য",img:IM("34804017"),cat:"programming",author:"রাফিদ আহমেদ",mins:8,views:8450,trend:true,feat:false,tags:["Rust","Go","ব্যাকএন্ড"],days:0},
  {id:16,slug:"bangladesh-5g-rollout",title:"বাংলাদেশে 5G: কবে আসছে আর কী বদলাবে?",excerpt:"5G শুধু দ্রুত ইন্টারনেট নয় — IoT, স্মার্ট সিটি আর রিমোট সার্জারির দরজা খুলে দেবে এই প্রযুক্তি।",content:"বাংলাদেশে 5G নিয়ে আলোচনা তুঙ্গে।\n\n## 5G-তে কী কী সম্ভব\n\n- ১ Gbps+ ডাউনলোড স্পিড\n- ১ মিলিসেকেন্ডের কম লেটেন্সি\n- প্রতি বর্গকিলোমিটারে ১০ লক্ষ ডিভাইস সংযোগ\n\n## বাংলাদেশের চ্যালেঞ্জ\n\n- স্পেকট্রাম বরাদ্দের জটিলতা\n- টাওয়ার ইনফ্রাস্ট্রাকচার ঘাটতি\n- ডিভাইসের দাম এখনো বেশি\n\n> 5G আসবে, কিন্তু সবার হাতে পৌঁছাতে সময় লাগবে।\n\n## সম্ভাব্য সময়সীমা\n\nবিশেষজ্ঞরা বলছেন ২০২৭ সালের মধ্যে ঢাকা ও চট্টগ্রামে সীমিত পরিসরে 5G চালু হতে পারে।",img:IM("18545013"),cat:"gadgets",author:"সাদিয়া রহমান",mins:6,views:12800,trend:true,feat:false,tags:["5G","মোবাইল","বাংলাদেশ"],days:0},
  {id:17,slug:"linux-kernel-bangla-guide",title:"লিনাক্স কার্নেল বাংলায়: অপারেটিং সিস্টেমের হৃদপিণ্ড যেভাবে কাজ করে",excerpt:"কার্নেল কী, প্রসেস শিডিউলিং কীভাবে হয়, মেমোরি ম্যানেজমেন্ট কী — সব একসাথে সহজ বাংলায়।",content:"লিনাক্স কার্নেল হলো অপারেটিং সিস্টেমের মূল অংশ যেটা হার্ডওয়্যার আর সফটওয়্যারের মধ্যে সেতু হিসেবে কাজ করে।\n\n## কার্নেলের প্রধান কাজ\n\n- প্রসেস ম্যানেজমেন্ট: কোন প্রোগ্রাম কখন CPU পাবে\n- মেমোরি ম্যানেজমেন্ট: RAM ভাগাভাগি ও ভার্চুয়াল মেমোরি\n- ডিভাইস ড্রাইভার: হার্ডওয়্যারের সাথে যোগাযোগ\n- ফাইল সিস্টেম: ডেটা সংরক্ষণ ও পুনরুদ্ধার\n\n## কেন শেখা দরকার\n\n> যারা সিস্টেম প্রোগ্রামিং, DevOps বা এমবেডেড সিস্টেমে কাজ করতে চান, কার্নেলের ধারণা তাদের জন্য অপরিহার্য।\n\n## শুরু করবেন কীভাবে\n\n- প্রথমে বেসিক C প্রোগ্রামিং শিখুন\n- /proc ফাইল সিস্টেম ঘেঁটে দেখুন\n- একটি সাধারণ কার্নেল মডিউল লিখে দেখুন",img:IM("693859"),cat:"programming",author:"রাফিদ আহমেদ",mins:10,views:7320,trend:false,feat:false,tags:["লিনাক্স","কার্নেল","সিস্টেম"],days:0},
  {id:18,slug:"ai-in-healthcare-bangladesh",title:"স্বাস্থ্যসেবায় AI: বাংলাদেশের হাসপাতালে কৃত্রিম বুদ্ধিমত্তা কতদূর?",excerpt:"রোগ নির্ণয়ে AI মডেল, টেলিমেডিসিনে চ্যাটবট, ড্রাগ ডিসকভারি — বাংলাদেশের স্বাস্থ্য খাতে AI বিপ্লবের হালচাল।",content:"কৃত্রিম বুদ্ধিমত্তা বিশ্বজুড়ে স্বাস্থ্যসেবায় বিপ্লব ঘটাচ্ছে, বাংলাদেশও পিছিয়ে নেই।\n\n## কোথায় ব্যবহার হচ্ছে\n\n- চেস্ট এক্স-রে থেকে যক্ষ্মা শনাক্তকরণ\n- ডায়াবেটিক রেটিনোপ্যাথি স্ক্রিনিং\n- টেলিমেডিসিন প্ল্যাটফর্মে AI ট্রায়াজ\n\n## সাফল্যের গল্প\n\n> একটি দেশীয় স্টার্টআপ ইতোমধ্যে ৫০,০০০+ এক্স-রে বিশ্লেষণ করেছে AI দিয়ে, নির্ভুলতা ৯৪% এর বেশি।\n\n## বাধা কোথায়\n\n- প্রশিক্ষিত ডেটার অভাব\n- রেগুলেটরি ফ্রেমওয়ার্ক নেই\n- চিকিৎসকদের মধ্যে সংশয়\n\n## ভবিষ্যৎ\n\nসরকার ও বেসরকারি উদ্যোগ মিলে কাজ করলে আগামী ৫ বছরে প্রাথমিক স্বাস্থ্যসেবায় AI ব্যাপকভাবে ব্যবহৃত হতে পারে।",img:IM("30547574"),cat:"ai",author:"তানভীর হাসান",mins:9,views:11560,trend:true,feat:false,tags:["AI","স্বাস্থ্যসেবা","বাংলাদেশ"],days:0},
  {id:19,slug:"ev-revolution-bangladesh-2026",title:"ইলেকট্রিক গাড়ির বিপ্লব: বাংলাদেশে EV চার্জিং ইনফ্রাস্ট্রাকচার কতটা প্রস্তুত?",excerpt:"জ্বালানি খরচ কমানো থেকে পরিবেশ রক্ষা — ইলেকট্রিক গাড়ি বাংলাদেশের সড়কে আসতে কী কী বাধা পেরোতে হবে?",content:"বিশ্বজুড়ে ইলেকট্রিক ভেহিকেল (EV) বিপ্লব চলছে। বাংলাদেশেও এই ঢেউ আসতে শুরু করেছে, তবে পথ এখনো বন্ধুর।\n\n## বর্তমান চিত্র\n\n- ঢাকায় ইজি বাইক ও অটো রিকশায় ইলেকট্রিক মোটর ব্যাপকভাবে ব্যবহৃত\n- টেসলা, BYD-এর গাড়ি আমদানি শুরু হয়েছে সীমিত পরিসরে\n- সরকার EV আমদানিতে শুল্ক ছাড় দিয়েছে\n\n## চার্জিং ইনফ্রাস্ট্রাকচার\n\nএটাই সবচেয়ে বড় চ্যালেঞ্জ। পুরো দেশে পাবলিক চার্জিং স্টেশন হাতে গোনা।\n\n- ঢাকায় মাত্র ১২-১৫টি ফাস্ট চার্জিং পয়েন্ট\n- চট্টগ্রাম ও সিলেটে প্রায় শূন্য\n- অ্যাপার্টমেন্ট বিল্ডিংয়ে হোম চার্জিং সেটআপ করা কঠিন\n\n> চার্জিং পয়েন্ট ছাড়া EV বিক্রি বাড়ানো অসম্ভব, আবার চাহিদা ছাড়া কেউ চার্জিং পয়েন্ট বসাতে চায় না — এটাই চিকেন-অ্যান্ড-এগ সমস্যা।\n\n## ব্যাটারি প্রযুক্তি\n\nসলিড-স্টেট ব্যাটারি আসলে চার্জিং সময় ১০ মিনিটে নামতে পারে এবং রেঞ্জ ৮০০ কিলোমিটার ছাড়াবে।\n\n## ভবিষ্যৎ পরিকল্পনা\n\n- জাতীয় মহাসড়কে প্রতি ৫০ কিমিতে চার্জিং স্টেশন স্থাপনের পরিকল্পনা\n- সোলার-পাওয়ার্ড চার্জিং হাব\n- ব্যাটারি সোয়াপিং মডেল থ্রি-হুইলারের জন্য\n\nবাংলাদেশের EV ভবিষ্যৎ উজ্জ্বল, তবে সেটা বাস্তবায়নে সরকার, বেসরকারি খাত ও ভোক্তা — তিন পক্ষকেই একসাথে এগোতে হবে।",img:IM("35736778"),cat:"science",author:"ড. মেহজাবিন আলম",mins:8,views:9870,trend:true,feat:false,tags:["EV","ইলেকট্রিক গাড়ি","চার্জিং"],days:0},
  {id:20,slug:"web3-blockchain-bangla-explained",title:"Web3 ও ব্লকচেইন সহজ বাংলায়: হাইপের আড়ালে আসল প্রযুক্তি কী?",excerpt:"ক্রিপ্টোকারেন্সি, NFT, DAO — শব্দগুলো শুনেছেন অনেক, কিন্তু ব্লকচেইন আসলে কী সমস্যার সমাধান করে?",content:"Web3 নিয়ে হাইপ অনেক, কিন্তু মূল প্রযুক্তি বোঝার চেষ্টা কম। আজ সেই চেষ্টাটাই করব।\n\n## ব্লকচেইন কী — এক লাইনে\n\nএমন একটা ডিজিটাল খাতা যেখানে একবার লেখা হলে কেউ মুছতে বা বদলাতে পারে না, আর সবাই সেটা দেখতে পায়।\n\n## কোথায় সত্যিই কাজে লাগছে\n\n- সাপ্লাই চেইনে পণ্যের উৎস ট্র্যাকিং\n- আন্তর্জাতিক রেমিট্যান্সে মধ্যস্থতাকারী বাদ দেওয়া\n- ডিজিটাল পরিচয় ব্যবস্থাপনা\n- জমির রেকর্ড ও সরকারি নথি যাচাই\n\n## কোথায় হাইপ বেশি\n\n> NFT-তে লাখ লাখ টাকার ছবি বিক্রি হওয়ার গল্প শুনে অনেকে মনে করেন ব্লকচেইন মানেই দ্রুত টাকা। বাস্তবতা ভিন্ন।\n\n- বেশিরভাগ NFT প্রজেক্ট ব্যর্থ হয়েছে\n- ক্রিপ্টো মার্কেট অত্যন্ত অস্থির\n- অনেক Web3 প্রজেক্ট আসলে Web2 দিয়েই করা সম্ভব\n\n## বাংলাদেশে অবস্থা\n\nবাংলাদেশ ব্যাংক ক্রিপ্টোকারেন্সি নিষিদ্ধ রেখেছে, তবে ব্লকচেইন প্রযুক্তি গবেষণা উৎসাহিত করছে। কিছু স্টার্টআপ রেমিট্যান্স ও কৃষি সাপ্লাই চেইনে ব্লকচেইন পাইলট চালাচ্ছে।\n\n## শেখা শুরু করবেন কীভাবে\n\n- প্রথমে হ্যাশিং ও পাবলিক-কি ক্রিপ্টোগ্রাফি বুঝুন\n- Ethereum এর ডকুমেন্টেশন পড়ুন\n- একটি সিম্পল স্মার্ট কন্ট্রাক্ট লিখে দেখুন Solidity-তে",img:IM("7267598"),cat:"programming",author:"রাফিদ আহমেদ",mins:10,views:7650,trend:false,feat:false,tags:["ব্লকচেইন","Web3","ক্রিপ্টো"],days:0},
  {id:21,slug:"deepfake-detection-bangla",title:"ডিপফেক শনাক্তকরণ: AI-তৈরি ভুয়া ভিডিও চেনার ৫টি উপায়",excerpt:"নির্বাচন থেকে সাইবার বুলিং — ডিপফেক এখন বাস্তব হুমকি। কীভাবে আসল থেকে নকল আলাদা করবেন?",content:"AI দিয়ে মুখ বদলে দেওয়া ভিডিও তৈরি এখন এতটাই সহজ যে সাধারণ মানুষও ফোনে ডিপফেক বানাতে পারে। এটা মজার হলেও, অপব্যবহারের ঝুঁকি ভয়ঙ্কর।\n\n## ডিপফেক কীভাবে কাজ করে\n\nGAN (Generative Adversarial Network) বা ডিফিউশন মডেল ব্যবহার করে একজনের মুখ আরেকজনের ভিডিওতে বসিয়ে দেওয়া হয়।\n\n## চেনার ৫টি উপায়\n\n- চোখের পলক অস্বাভাবিক — ডিপফেকে পলক কম পড়ে\n- ঠোঁটের নড়াচড়া ও অডিও সিঙ্কে গড়বড় থাকে\n- মুখের প্রান্তে ব্লার বা ঝাপসা দেখা যায়\n- কানের আকৃতি বা দাঁতের বিন্যাস অসামঞ্জস্যপূর্ণ\n- আলো ও ছায়ার দিক মেলে না\n\n> সবচেয়ে ভালো প্রতিরক্ষা হলো সচেতনতা। কোনো ভিডিও অবিশ্বাস্য মনে হলে, সম্ভবত সেটা অবিশ্বাস্যই।\n\n## প্রযুক্তিগত সমাধান\n\n- Microsoft Video Authenticator\n- Intel FakeCatcher (রক্ত প্রবাহের প্যাটার্ন বিশ্লেষণ)\n- ওয়াটারমার্কিং ও কনটেন্ট প্রভেন্যান্স স্ট্যান্ডার্ড (C2PA)\n\n## আইনি দিক\n\nবাংলাদেশে ডিপফেক নির্দিষ্টভাবে আইনে উল্লেখ নেই, তবে ডিজিটাল নিরাপত্তা আইনের আওতায় মামলা হতে পারে।",img:IM("30547577"),cat:"cyber-security",author:"নুসরাত জাহান",mins:7,views:13240,trend:true,feat:false,tags:["ডিপফেক","AI","নিরাপত্তা"],days:0},
  {id:22,slug:"bangla-freelancing-2026",title:"বাংলাদেশের ফ্রিল্যান্সিং ২০২৬: AI যুগে কোন দক্ষতায় কাজ পাবেন?",excerpt:"গ্রাফিক ডিজাইন আর ডেটা এন্ট্রির দিন ফুরিয়ে আসছে। AI যুগে টিকে থাকতে কোন দক্ষতা শিখবেন?",content:"বাংলাদেশ ফ্রিল্যান্সিংয়ে বিশ্বে দ্বিতীয়। কিন্তু AI-এর কারণে কাজের ধরন দ্রুত বদলে যাচ্ছে।\n\n## যেসব কাজ কমবে\n\n- সাধারণ গ্রাফিক ডিজাইন (AI ক্যানভা দিয়ে হচ্ছে)\n- বেসিক ওয়েব ডেভেলপমেন্ট (no-code টুলে)\n- কনটেন্ট রাইটিং (AI দিয়ে ড্রাফট হচ্ছে)\n- ম্যানুয়াল ডেটা এন্ট্রি\n\n## যেসব কাজ বাড়বে\n\n- AI প্রম্পট ইঞ্জিনিয়ারিং ও ফাইন-টিউনিং\n- সাইবার সিকিউরিটি অডিট\n- ভিডিও এডিটিং ও মোশন গ্রাফিক্স (AI-enhanced)\n- UX রিসার্চ ও প্রোডাক্ট ডিজাইন\n- ক্লাউড ইনফ্রাস্ট্রাকচার ও DevOps\n\n> AI টুল শেখা মানে চাকরি হারানো নয়, AI দিয়ে দ্বিগুণ কাজ করার ক্ষমতা অর্জন।\n\n## কৌশল\n\n- T-shaped দক্ষতা গড়ুন — একটি বিষয়ে গভীর, বাকিতে ব্রড\n- পোর্টফোলিওতে AI টুল ব্যবহারের প্রমাণ রাখুন\n- ক্লায়েন্টকে ফলাফল বেচুন, ঘণ্টা নয়",img:IM("28494632"),cat:"startup",author:"ইমরান কবির",mins:7,views:16890,trend:true,feat:false,tags:["ফ্রিল্যান্সিং","AI","ক্যারিয়ার"],days:0},
  {id:23,slug:"apple-vision-pro-review-bangla",title:"Apple Vision Pro রিভিউ: স্থানিক কম্পিউটিং কি সত্যিই ভবিষ্যৎ?",excerpt:"চোখের ট্র্যাকিং, হ্যান্ড জেসচার আর মিক্সড রিয়েলিটি — Apple-এর সবচেয়ে উচ্চাভিলাষী প্রোডাক্ট কেমন?",content:"Apple Vision Pro নিয়ে প্রচুর হাইপ ছিল। দুই সপ্তাহ ব্যবহারের পর বলতে পারি — এটা ভবিষ্যতের একটা ঝলক, কিন্তু বর্তমানের প্রোডাক্ট হিসেবে সীমাবদ্ধতা আছে।\n\n## যা ভালো লেগেছে\n\n- ডিসপ্লে কোয়ালিটি অবিশ্বাস্য — প্রতিটি পিক্সেল স্পষ্ট\n- আই ট্র্যাকিং + হ্যান্ড জেসচার কম্বিনেশন অসাধারণ স্বাভাবিক\n- স্থানিক ভিডিও (Spatial Video) আবেগের অন্য মাত্রা\n- ম্যাক ভার্চুয়াল ডিসপ্লে হিসেবে দারুণ কাজ করে\n\n## যেখানে হোঁচট খেয়েছে\n\n- ওজন — ২ ঘণ্টার বেশি পরলে ক্লান্ত লাগে\n- ব্যাটারি মাত্র ২ ঘণ্টার\n- অ্যাপ ইকোসিস্টেম এখনো দুর্বল\n- দাম বাংলাদেশের বাজারে অবাস্তব\n\n> Vision Pro একটি ডেভেলপার কিট যেটা ভুলবশত কনজিউমারদের কাছে বিক্রি হচ্ছে।\n\n## বাংলাদেশের জন্য প্রাসঙ্গিকতা\n\nসরাসরি ব্যবহারে এখনো প্রাসঙ্গিক নয়। তবে AR/VR ডেভেলপমেন্ট দক্ষতা শিখলে আন্তর্জাতিক বাজারে বড় সুযোগ আছে।\n\n## ভবিষ্যৎ প্রজন্ম\n\nদ্বিতীয় প্রজন্মে ওজন কমবে, দাম নামবে, এবং আরও অ্যাপ আসবে। তখনই এটা মূলধারায় আসতে পারে।",img:IM("6727761"),cat:"gadgets",author:"সাদিয়া রহমান",mins:9,views:14320,trend:true,feat:false,tags:["Apple","Vision Pro","AR/VR"],days:0},
  {id:24,slug:"python-vs-javascript-beginners-2026",title:"প্রোগ্রামিং শুরু করবেন? Python নাকি JavaScript — কোনটা আগে শিখবেন?",excerpt:"নতুনদের চিরন্তন প্রশ্ন: প্রথম প্রোগ্রামিং ভাষা কোনটা হওয়া উচিত? দুটোর সুবিধা-অসুবিধা তুলনা করে সিদ্ধান্ত নিন।",content:"প্রোগ্রামিং শেখার প্রথম ধাপেই সবচেয়ে বড় দ্বিধা — কোন ভাষা দিয়ে শুরু করব?\n\n## Python-এর পক্ষে\n\n- সিনট্যাক্স সহজ, প্রায় ইংরেজি পড়ার মতো\n- ডেটা সায়েন্স, AI, মেশিন লার্নিংয়ে রাজা\n- অটোমেশন স্ক্রিপ্ট লেখা খুব সহজ\n- বিশাল লাইব্রেরি ইকোসিস্টেম\n\n## JavaScript-এর পক্ষে\n\n- ব্রাউজারে সরাসরি চলে — ফলাফল তাৎক্ষণিক দেখা যায়\n- ফ্রন্টএন্ড + ব্যাকএন্ড (Node.js) দুটোতেই কাজ করে\n- ওয়েব ডেভেলপমেন্টে অপরিহার্য\n- চাকরির বাজারে চাহিদা সবচেয়ে বেশি\n\n## আমার পরামর্শ\n\n> ভাষা নিয়ে ভাবতে ভাবতে সময় নষ্ট করবেন না। যেকোনো একটা বেছে নিয়ে শুরু করুন। প্রোগ্রামিং-এর মূল ধারণা (লুপ, কন্ডিশন, ফাংশন) সব ভাষায় একই।\n\n## কে কোনটা শিখবেন\n\n- ওয়েবসাইট বা অ্যাপ বানাতে চান → JavaScript\n- ডেটা বিশ্লেষণ বা AI শিখতে চান → Python\n- দুটোই শিখতে চান → Python দিয়ে শুরু, ৩ মাস পর JavaScript\n\n## ভুল যেটা করবেন না\n\nএকসাথে ৫টা ভাষা শিখতে যাওয়া। একটায় দক্ষ হোন, বাকিগুলো এমনিতেই সহজ লাগবে।",img:IM("34804018"),cat:"programming",author:"অর্পিতা সেন",mins:6,views:21340,trend:true,feat:false,tags:["Python","JavaScript","প্রোগ্রামিং শেখা"],days:0}

/* ══════════════ ROUTER ══════════════ */
const R=window.R={
  go(hash){location.hash="#/"+hash;},
  route(){
    const h=(location.hash||"#/").slice(2);
    window.scrollTo({top:0,behavior:"instant"});
    if(!h||h==="/") return renderHome();
    if(h.startsWith("article/")) return renderArticle(h.slice(8));
    if(h.startsWith("category/")) return renderCategory(h.slice(9));
    if(h==="about") return renderAbout();
    if(h.startsWith("search/")) return renderSearch(decodeURIComponent(h.slice(7)));
    renderHome();
  }
};
window.addEventListener("hashchange",()=>R.route());

/* ══════════════ NAV ══════════════ */
const NAV=[{l:"হোম",h:""},{l:"সব লেখা",h:""},{l:"আমাদের কথা",h:"about"}];
function buildNav(){
  const links=NAV.map(n=>`<a onclick="R.go('${n.h}')">${n.l}</a>`).join("");
  $("#nav-links").innerHTML=links;
  const mobileLinks=NAV.map(n=>`<a onclick="R.go('${n.h}');closeMobile()">${n.l}</a>`).join("")
    + CATS.map(c=>`<a onclick="R.go('category/${c.slug}');closeMobile()">${c.nameBn}</a>`).join("");
  $("#mobile-nav").innerHTML=mobileLinks;
  $("#footer-nav").innerHTML=NAV.map(n=>`<li><a onclick="R.go('${n.h}')"><span class="bullet"></span>${n.l}</a></li>`).join("");
  $("#footer-cats").innerHTML=CATS.map(c=>`<li><a onclick="R.go('category/${c.slug}')"><span class="bullet"></span>${c.nameBn}</a></li>`).join("");
  $("#f-year").textContent=bn(new Date().getFullYear());
}
function closeMobile(){$("#mobile-menu").classList.remove("open");$("#menu-open-icon").style.display="";$("#menu-close-icon").style.display="none";}
window.subscribeNL=function(form,event){
  event.preventDefault();
  const input=form.querySelector('input');
  const msg=form.parentElement.querySelector('.nl-msg-out');
  if(!input.value.trim())return;
  msg.innerHTML='<div class="nl-msg">'+IC.check+'সাবস্ক্রিপশন সফল! ইনবক্সে চোখ রাখুন।</div>';
  input.value='';
  setTimeout(()=>{msg.innerHTML='';},4500);
};
$("#mobile-toggle").addEventListener("click",()=>{const o=$("#mobile-menu").classList.toggle("open");$("#menu-open-icon").style.display=o?"none":"";$("#menu-close-icon").style.display=o?"":"none";});
window.addEventListener("scroll",()=>{const nb=$("#navbar");nb.classList.toggle("scrolled",scrollY>24);const bt=$("#back-to-top");bt.classList.toggle("visible",scrollY>500);},{passive:true});

function setupSearch(){
  const go=v=>{const q=v.trim();if(q)R.go("search/"+encodeURIComponent(q));};
  $("#search-input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(e.target.value);}});
  $("#m-search-input").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(e.target.value);closeMobile();}});
}

    <div class="card-img"><img src="${p.img}" alt="${p.title}" loading="lazy"/><div class="img-overlay"></div>
      <span class="cat-badge" onclick="event.stopPropagation();R.go('category/${p.cat}')">${c?.nameBn||""}</span>

}

function homeInteractions(){
  let sort="latest",cat="all",limit=6;
  const filtered=()=>{
    let list=[...P];
    if(cat!=="all") list=list.filter(p=>p.cat===cat);
    if(sort==="popular") list.sort((a,b)=>b.views-a.views);
    else if(sort==="trending") list.sort((a,b)=>(b.trend?1:0)-(a.trend?1:0)||b.views-a.views);
    else list.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
    return list;
  };
  const render=()=>{
    const list=filtered(),vis=list.slice(0,limit);
    const g=document.getElementById("pgrid");
    g.innerHTML=vis.length?vis.map((p,i)=>postCard(p,i)).join(""):`<div class="empty-state glass">${IC.search}<h3>কোনো লেখা পাওয়া যায়নি</h3></div>`;
    document.getElementById("lm").style.display=list.length>limit?"block":"none";
  };
  const chips=()=>{
    const el=document.getElementById("chips");
    el.innerHTML=`<button class="chip${cat==="all"?" active":""}" onclick="this.hCat('all')">সবগুলো</button>`+CATS.map(c=>`<button class="chip${cat===c.slug?" active":""}" onclick="this.hCat('${c.slug}')">${c.nameBn} (${bn(c.count)})</button>`).join("");
    el.querySelectorAll(".chip").forEach(b=>{b.hCat=s=>{cat=s;limit=6;chips();render();};});
  };
  chips();render();

  document.getElementById("sort-pills")?.addEventListener("click",e=>{
    const b=e.target.closest(".sort-pill");if(!b)return;
    document.querySelectorAll(".sort-pill").forEach(p=>p.classList.remove("active"));
    b.classList.add("active");sort=b.dataset.s;limit=6;render();
  });
  document.getElementById("lm-btn")?.addEventListener("click",()=>{limit+=6;render();});
}

/* ══════════════ ARTICLE PAGE ══════════════ */
function renderArticle(slug){
  const p=P.find(x=>x.slug===slug);
  if(!p) return renderHome();
  const c=CATS.find(x=>x.slug===p.cat);
  document.title=p.title+" | প্রযুক্তির দর্পণ";

  const body=p.content.split("\n").map(l=>{
    l=l.trim();if(!l)return"";
    if(l.startsWith("## "))return`<h2>${l.slice(3)}</h2>`;
    if(l.startsWith("- "))return`<li>${l.slice(2)}</li>`;
    if(l.startsWith("> "))return`<blockquote class="glass">${l.slice(2)}</blockquote>`;
    return`<p>${l}</p>`;
  }).join("").replace(/(<li>.*?<\/li>)+/g,m=>`<ul>${m}</ul>`);

  const related=P.filter(x=>x.cat===p.cat&&x.slug!==slug).slice(0,3);

  $("#app").innerHTML=`<div class="article-page anim-page-in">
    <a class="back-link" onclick="history.back()">${IC.back} পেছনে যান</a>
    <span class="cat" onclick="R.go('category/${p.cat}')">${c?.nameBn||""}</span>
    <h1>${p.title}</h1>
    <div class="a-meta"><span>লেখক: ${p.author}</span><span>${IC.eye}${fv(p.views)} ভিউ</span><span>${IC.clock}${bn(p.mins)} মিনিট পড়া</span><span>${fd(p.publishedAt)}</span></div>
    <div class="cover glass"><img src="${p.img}" alt="${p.title}"/><div class="overlay"></div></div>
    <div class="article-body glass">${body}</div>
    <div class="article-tags">${p.tags.map(t=>`<span onclick="R.go('search/${encodeURIComponent(t)}')">#${t}</span>`).join("")}</div>
    ${related.length?`<div class="related-section"><h2>সম্পর্কিত <span class="text-gradient">লেখা</span></h2><div class="related-grid">${related.map((r,i)=>postCard(r,i)).join("")}</div></div>`:""}
  </div>`;
}
